[project]
name = "autopilot-worker"
version = "0.1.0"
description = "Autopilot Todo background worker"
requires-python = ">=3.10"
dependencies = [
  "celery>=5.4",
  "redis>=5.0",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "psycopg>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

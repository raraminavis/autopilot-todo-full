[project]
name = "autopilot-scheduler"
version = "0.1.0"
description = "Autopilot Todo scheduling service (OR-Tools CP-SAT)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-dateutil>=2.9",
  "or-tools>=9.10",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.ruff]
line-length = 100

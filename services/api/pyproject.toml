[project]
name = "autopilot-api"
version = "0.1.0"
description = "Autopilot Todo API service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg>=3.2",
  "alembic>=1.13",
  "python-dateutil>=2.9",
  "httpx>=0.27",
  "cryptography>=43.0",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
